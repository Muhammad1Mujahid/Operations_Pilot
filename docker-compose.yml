version: "3.9"

services:
  monitor:
    build: .
    command: python3 moniter.py
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - monitor
    restart: unless-stopped
